<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밝기 관찰 실험 대시보드</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #f0f3fb;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. 최상단 헤더 */
        header {
            background-color: #ffffff;
            height: 50px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: #2b3674;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #4a5568;
        }

        .sensor-count-group {
            display: flex;
            background-color: #edf2f7;
            padding: 2px;
            border-radius: 6px;
        }

        .btn-sensor-cnt {
            border: none;
            background: transparent;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            color: #4a5568;
        }

        .btn-sensor-cnt.active {
            background-color: #6c5ce7;
            color: white;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select.baud-select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            font-size: 12px;
            background-color: #fff;
        }

        .btn-header-conn {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            background-color: #6c5ce7;
            color: white;
            cursor: pointer;
        }

        .btn-header-conn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }

        .btn-header-conn.disconnect {
            background-color: #e53e3e;
        }

        /* 2. 메인 컨테이너 */
        .main-container {
            display: flex;
            flex: 1;
            padding: 12px;
            gap: 12px;
            height: calc(100vh - 50px);
        }

        /* 좌측 센서 카드 */
        .left-sidebar {
            width: 200px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #e2e8f0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: #4a5568;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #a0aec0;
        }

        .status-dot.active {
            background-color: #48bb78;
        }

        .sensor-card {
            background: linear-gradient(180deg, #f0f4ff 0%, #ffffff 100%);
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .sensor-tag {
            background-color: #6c5ce7;
            color: white;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .sensor-value-display {
            font-size: 28px;
            font-weight: 700;
            color: #5a4bda;
            margin-bottom: 20px;
        }

        /* 동적 전구 불빛 컨테이너 */
        .bulb-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .bulb-glow {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(250, 204, 21, 0.2);
            transition: all 0.2s ease;
            z-index: 1;
        }

        .bulb-icon {
            position: relative;
            z-index: 2;
            font-size: 45px;
            transition: filter 0.2s ease, transform 0.2s ease;
            filter: opacity(0.3);
        }

        .btn-record {
            margin-top: auto;
            background-color: #48bb78;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }

        /* 중앙 차트 영역 */
        .content-area {
            flex: 1;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        .top-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tab-group {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            border: none;
            background-color: #edf2f7;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #718096;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #6c5ce7;
            color: white;
        }

        .action-group {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            border: 1px solid #cbd5e0;
            background-color: #ffffff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
        }

        .btn-action.green {
            background-color: #48bb78;
            color: white;
            border-color: #48bb78;
        }

        .chart-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 10px 0;
        }

        .live-tag {
            background-color: #ebf8ff;
            color: #3182ce;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            min-height: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">🟡 밝기 관찰 실험</div>
        <div class="header-center">
            <span>밝기 센서 수:</span>
            <div class="sensor-count-group">
                <button class="btn-sensor-cnt active">1</button>
                <button class="btn-sensor-cnt">2</button>
                <button class="btn-sensor-cnt">3</button>
                <button class="btn-sensor-cnt">4</button>
            </div>
        </div>
        <div class="header-right">
            <select id="baudRate" class="baud-select">
                <option value="9600" selected>9600 bps</option>
                <option value="115200">115200 bps</option>
            </select>
            <button id="connectBtn" class="btn-header-conn">📍 장치 연결</button>
            <button id="startBtn" class="btn-header-conn" disabled>▶ 시작</button>
            <button id="stopBtn" class="btn-header-conn disconnect" disabled>🛑 해제</button>
        </div>
    </header>

    <div class="main-container">
        <div class="left-sidebar">
            <div class="panel-header">
                <span>🟡 밝기 센서</span>
                <span id="statusDot" class="status-dot"></span>
            </div>
            
            <div class="sensor-card">
                <div class="sensor-tag">밝기 1</div>
                <div id="sensorValue" class="sensor-value-display">0.0</div>
                <div class="bulb-wrapper">
                    <div id="bulbGlow" class="bulb-glow"></div>
                    <div id="bulbIcon" class="bulb-icon">💡</div>
                </div>
            </div>

            <button class="btn-record">✏️ 기록하기</button>
        </div>

        <div class="content-area">
            <div class="top-toolbar">
                <div class="tab-group">
                    <button class="tab-btn active">📊 실시간</button>
                    <button class="tab-btn">📋 관찰 기록표</button>
                    <button class="tab-btn">📈 관찰 그래프</button>
                </div>
                <div class="action-group">
                    <button id="exportCsvBtn" class="btn-action green">📄 CSV 저장 (구글시트)</button>
                    <button id="resetBtn" class="btn-action">🔄 새로고침</button>
                </div>
            </div>

            <div class="chart-header-info">
                <div class="live-tag">실시간 밝기: <span id="liveValueText">밝기 1: 0.0</span></div>
            </div>

            <div class="chart-wrapper">
                <canvas id="lightChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exportCsvBtn = document.getElementById('exportCsvBtn');
        const baudRateSelect = document.getElementById('baudRate');
        const statusDot = document.getElementById('statusDot');
        const sensorValue = document.getElementById('sensorValue');
        const liveValueText = document.getElementById('liveValueText');
        const bulbIcon = document.getElementById('bulbIcon');
        const bulbGlow = document.getElementById('bulbGlow');
        const ctx = document.getElementById('lightChart').getContext('2d');

        let port = null;
        let reader = null;
        let isReading = false;
        let lineBuffer = '';
        
        // 전체 수집 데이터 저장 배열 (CSV 추출용)
        const recordedHistory = [];
        const MAX_DATA_POINTS = 50;

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: '밝기 1',
                    data: [],
                    borderColor: '#6c5ce7',
                    backgroundColor: 'rgba(108, 92, 231, 0.1)',
                    borderWidth: 2,
                    pointRadius: 3,
                    tension: 0.2,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { grid: { color: '#f0f3fb' } },
                    y: { beginAtZero: true, max: 1024, grid: { color: '#f0f3fb' } }
                },
                plugins: { legend: { display: false } }
            }
        });

        connectBtn.addEventListener('click', async () => {
            if ('serial' in navigator) {
                try {
                    if (port) { try { await port.close(); } catch(e){} }
                    const baudRate = parseInt(baudRateSelect.value, 10);
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: baudRate });

                    statusDot.classList.add('active');
                    connectBtn.disabled = true;
                    baudRateSelect.disabled = true;
                    startBtn.disabled = false;
                } catch (err) {
                    alert('장치 연결 실패: ' + err.message);
                    port = null;
                }
            } else {
                alert('이 브라우저는 Web Serial API를 지원하지 않습니다.');
            }
        });

        startBtn.addEventListener('click', () => {
            if (port && port.readable && !isReading) {
                isReading = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                readLoop();
            }
        });

        stopBtn.addEventListener('click', async () => {
            if (isReading) {
                isReading = false;
                if (reader) { try { await reader.cancel(); } catch(e){} }
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        });

        resetBtn.addEventListener('click', () => {
            chart.data.labels = [];
            chart.data.datasets[0].data = [];
            chart.update();
            sensorValue.textContent = '0.0';
            liveValueText.textContent = '밝기 1: 0.0';
            recordedHistory.length = 0;
            updateBulbEffect(0);
        });

        // CSV 저장 및 구글 시트 연동 다운로드
        exportCsvBtn.addEventListener('click', () => {
            if (recordedHistory.length === 0) {
                alert('저장할 측정 데이터가 없습니다.');
                return;
            }

            let csvContent = '\uFEFF'; // UTF-8 한글 깨짐 방지 BOM
            csvContent += '측정시간,밝기값\n';

            recordedHistory.forEach(row => {
                csvContent += `"${row.time}",${row.value}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            const now = new Date();
            const filename = `밝기_관찰_데이터_${now.toISOString().slice(0,10)}_${now.getHours()}${now.getMinutes()}${now.getSeconds()}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        async function readLoop() {
            const textDecoder = new TextDecoder();
            while (port && port.readable && isReading) {
                try {
                    reader = port.readable.getReader();
                    while (isReading) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) {
                            processData(textDecoder.decode(value, { stream: true }));
                        }
                    }
                } catch (error) {
                    console.error('수신 에러:', error);
                } finally {
                    if (reader) { try { reader.releaseLock(); } catch(e){} }
                }
            }
        }

        function processData(data) {
            lineBuffer += data;
            let lines = lineBuffer.split('\n');
            lineBuffer = lines.pop();

            lines.forEach(line => {
                const match = line.trim().match(/\d+/);
                if (match) updateChart(parseInt(match[0], 10));
            });
        }

        // 실시간 전구 크기/빛 번짐(Glow) 동적 업데이트
        function updateBulbEffect(value) {
            const ratio = Math.min(Math.max(value / 1024, 0), 1); // 0 ~ 1 비율
            
            // 1. 전구 아이콘 투명도 및 확대 비율
            const opacity = 0.2 + (ratio * 0.8);
            const scale = 0.9 + (ratio * 0.3);
            bulbIcon.style.filter = `opacity(${opacity}) drop-shadow(0 0 ${ratio * 15}px rgba(250, 204, 21, ${ratio}))`;
            bulbIcon.style.transform = `scale(${scale})`;

            // 2. 배경 빛 번짐(Glow) 크기 및 블러
            const glowSize = 30 + (ratio * 80); // 30px ~ 110px
            const glowOpacity = ratio * 0.8;
            bulbGlow.style.width = `${glowSize}px`;
            bulbGlow.style.height = `${glowSize}px`;
            bulbGlow.style.backgroundColor = `rgba(250, 204, 21, ${glowOpacity})`;
            bulbGlow.style.boxShadow = `0 0 ${glowSize / 2}px ${glowSize / 4}px rgba(250, 204, 21, ${glowOpacity})`;
        }

        function updateChart(value) {
            const currentTime = new Date().toLocaleTimeString();

            sensorValue.textContent = value.toFixed(1);
            liveValueText.textContent = `밝기 1: ${value.toFixed(1)}`;

            // 데이터 기록 배열에 추가
            recordedHistory.push({ time: currentTime, value: value });

            // 동적 불빛 이펙트 적용
            updateBulbEffect(value);

            // 그래프 업데이트
            const chartData = chart.data.datasets[0].data;
            const chartLabels = chart.data.labels;

            chartData.push(value);
            chartLabels.push(currentTime);

            if (chartData.length > MAX_DATA_POINTS) {
                chartData.shift();
                chartLabels.shift();
            }
            chart.update();
        }
    </script>
</body>
</html>
